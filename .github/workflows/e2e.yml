name: End-to-end tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx tsc --noEmit
      - run: bun run check
      - run: bun run test
        env:
          TURSO_DATABASE_URL: file:local.db
          BETTER_AUTH_SECRET: test-only-secret-not-for-production-000001
      - run: bun run build
        env:
          TURSO_DATABASE_URL: file:local.db
          BETTER_AUTH_SECRET: build-only-secret-not-for-production-00001
      - run: bun run test:e2e
      - name: Upload failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
